<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>PDF Viewer & Tools</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body data-tool="select">
    <div id="app">
      <!-- Topbar -->
      <header id="topbar">
        <div class="tb-group tb-left">
          <button
            id="btnSidebar"
            class="icon-btn"
            title="Toggle sidebar (Ctrl+B)"
            aria-label="Toggle sidebar"
          >
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M9 4v16" />
            </svg>
          </button>
          <button
            id="btnOpen"
            class="icon-btn"
            title="Buka PDF (Ctrl+O)"
            aria-label="Buka PDF"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"
              />
            </svg>
          </button>
          <button
            id="btnUrl"
            class="icon-btn"
            title="Buka dari URL"
            aria-label="Buka dari URL"
          >
            <svg viewBox="0 0 24 24">
              <path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1.5 1.5" />
              <path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1.5-1.5" />
            </svg>
          </button>
          <div id="fileInfo">
            <span id="fileName">Belum ada file</span>
            <span id="fileMeta">Buka PDF untuk mulai</span>
          </div>
        </div>

        <div class="tb-group tb-center">
          <button
            id="btnPrev"
            class="icon-btn"
            title="Halaman sebelumnya"
            aria-label="Halaman sebelumnya"
          >
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
          </button>
          <input
            id="pageInput"
            type="number"
            min="1"
            value="1"
            aria-label="Nomor halaman"
          />
          <span id="pageCount">/ 0</span>
          <button
            id="btnNext"
            class="icon-btn"
            title="Halaman berikutnya"
            aria-label="Halaman berikutnya"
          >
            <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>

        <div class="tb-group tb-right">
          <button
            id="btnZoomOut"
            class="icon-btn hide-sm"
            title="Zoom out (Ctrl+-)"
            aria-label="Zoom out"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="M8 11h6M20 20l-4-4" />
            </svg>
          </button>
          <select id="zoomSelect" class="pill hide-sm" aria-label="Zoom preset">
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
            <option value="3">300%</option>
            <option value="4">400%</option>
          </select>
          <button
            id="btnZoomIn"
            class="icon-btn hide-sm"
            title="Zoom in (Ctrl+=)"
            aria-label="Zoom in"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="M11 8v6M8 11h6M20 20l-4-4" />
            </svg>
          </button>
          <button
            id="btnFitWidth"
            class="icon-btn hide-sm"
            title="Fit width"
            aria-label="Fit width"
          >
            <svg viewBox="0 0 24 24">
              <path d="M3 12h18M3 12l4-4M3 12l4 4M21 12l-4-4M21 12l-4 4" />
            </svg>
          </button>
          <button
            id="btnFitPage"
            class="icon-btn hide-sm"
            title="Fit page (Ctrl+0)"
            aria-label="Fit page"
          >
            <svg viewBox="0 0 24 24">
              <rect x="5" y="3" width="14" height="18" rx="1" />
              <path d="M9 8h6M9 12h6M9 16h4" />
            </svg>
          </button>
          <button
            id="btnRotate"
            class="icon-btn hide-sm"
            title="Rotate 90°"
            aria-label="Rotate"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 9a8 8 0 1114 5" />
              <path d="M4 4v5h5" />
            </svg>
          </button>
          <button
            id="btnUndo"
            class="icon-btn"
            title="Undo (Ctrl+Z)"
            aria-label="Undo"
            disabled
          >
            <svg viewBox="0 0 24 24">
              <path d="M9 14l-4-4 4-4" />
              <path d="M5 10h9a5 5 0 010 10h-4" />
            </svg>
          </button>
          <button
            id="btnRedo"
            class="icon-btn"
            title="Redo (Ctrl+Y)"
            aria-label="Redo"
            disabled
          >
            <svg viewBox="0 0 24 24">
              <path d="M15 14l4-4-4-4" />
              <path d="M19 10h-9a5 5 0 000 10h4" />
            </svg>
          </button>
          <button
            id="btnSearch"
            class="icon-btn"
            title="Cari (Ctrl+F)"
            aria-label="Cari"
          >
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-4-4" />
            </svg>
          </button>
          <div class="reading-mode-wrap">
            <button
              id="btnReadingMode"
              class="icon-btn"
              title="Mode baca: Normal"
              aria-label="Mode baca"
            >
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                />
              </svg>
            </button>
            <div
              id="readingModeMenu"
              class="reading-mode-menu"
              role="menu"
            ></div>
          </div>
          <button
            id="btnTheme"
            class="icon-btn"
            title="Ganti tema"
            aria-label="Ganti tema"
          >
            <svg viewBox="0 0 24 24">
              <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
            </svg>
          </button>
          <button
            id="btnFullscreen"
            class="icon-btn"
            title="Presentasi (F)"
            aria-label="Presentasi"
          >
            <svg viewBox="0 0 24 24">
              <path d="M8 3H5a2 2 0 00-2 2v3" />
              <path d="M21 8V5a2 2 0 00-2-2h-3" />
              <path d="M3 16v3a2 2 0 002 2h3" />
              <path d="M16 21h3a2 2 0 002-2v-3" />
            </svg>
          </button>
          <button
            id="btnPrint"
            class="icon-btn"
            title="Print (Ctrl+P)"
            aria-label="Print"
          >
            <svg viewBox="0 0 24 24">
              <path d="M6 9V2h12v7" />
              <path
                d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"
              />
              <rect x="6" y="14" width="12" height="8" />
            </svg>
          </button>
          <button
            id="btnOCR"
            class="icon-btn"
            title="OCR — Extract text (scanned pages)"
            aria-label="OCR"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 7V4h4M4 17v3h4M20 7V4h-4M20 17v3h-4" />
              <path d="M9 12h6M9 15h4M9 9h6" />
            </svg>
          </button>
          <button
            id="btnMerge"
            class="icon-btn"
            title="Gabung PDF"
            aria-label="Gabung PDF"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M8 2h6l4 4v10a2 2 0 01-2 2h-8a2 2 0 01-2-2V4a2 2 0 012-2z"
              />
              <path d="M14 2v4h4" />
              <path d="M4 8v10a2 2 0 002 2h8" />
            </svg>
          </button>
          <button
            id="btnSave"
            class="icon-btn primary"
            title="Simpan PDF (Ctrl+S)"
            aria-label="Simpan PDF"
            disabled
          >
            Save
          </button>
        </div>

        <div id="progressWrap"><div id="progressBar"></div></div>
      </header>

      <!-- Body -->
      <div id="body">
        <aside id="sidebar">
          <div id="sidebarTabs">
            <button data-tab="thumbs" class="active">Thumbs</button>
            <button data-tab="outline">Outline</button>
            <button data-tab="search">Search</button>
            <button data-tab="annos">Anotasi</button>
          </div>

          <div class="side-panel active" id="panel-thumbs">
            <div id="thumbGrid"></div>
          </div>

          <div class="side-panel" id="panel-outline">
            <div id="outlineTree">
              <div class="empty-hint">Belum ada dokumen</div>
            </div>
          </div>

          <div class="side-panel" id="panel-search">
            <div class="search-box">
              <input
                id="searchInput"
                type="text"
                placeholder="Cari teks…"
                aria-label="Kata kunci pencarian"
              />
              <button
                id="searchPrev"
                class="icon-btn"
                title="Sebelumnya"
                aria-label="Hasil sebelumnya"
              >
                <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></svg>
              </button>
              <button
                id="searchNext"
                class="icon-btn"
                title="Berikutnya"
                aria-label="Hasil berikutnya"
              >
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
              </button>
            </div>
            <label class="search-opt"
              ><input type="checkbox" id="searchCase" /> Case sensitive</label
            >
            <div id="searchCount"></div>
            <div id="searchResults"></div>
          </div>

          <div class="side-panel" id="panel-annos">
            <div id="annoList">
              <div class="empty-hint">Belum ada anotasi</div>
            </div>
          </div>
        </aside>

        <main id="viewer" tabindex="0" aria-label="Area dokumen">
          <div id="pages"></div>
          <div id="emptyState">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
              <path d="M14 2v6h6" />
              <path d="M8 13h8M8 17h5" />
            </svg>
            <h2>PDF Viewer &amp; Tools</h2>
            <p>
              Drag &amp; drop file PDF ke sini, atau klik tombol di bawah. Semua
              proses berjalan di browser Anda — tidak ada file yang diunggah ke
              server.
            </p>
            <button class="btn primary" id="btnOpenEmpty">Buka PDF</button>
          </div>
        </main>
      </div>

      <!-- Bottom toolbar -->
      <div id="toolbar" role="toolbar" aria-label="Alat anotasi">
        <button
          class="tool-btn active"
          data-tool="select"
          title="Select (V)"
          aria-label="Select"
        >
          <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.5L10 20z" /></svg>
        </button>
        <button
          class="tool-btn"
          data-tool="highlight"
          title="Highlight (H)"
          aria-label="Highlight"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 20h5" />
            <path d="M14.5 4.5l5 5-9 9-5-5z" />
            <path d="M13 6l5 5" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="underline"
          title="Underline (U)"
          aria-label="Underline"
        >
          <svg viewBox="0 0 24 24">
            <path d="M7 4v7a5 5 0 0010 0V4" />
            <path d="M5 20h14" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="strike"
          title="Strikethrough (S)"
          aria-label="Strikethrough"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 12h16" />
            <path d="M7 7a4 4 0 014-3h2a4 4 0 014 3" />
            <path d="M7 17a4 4 0 004 3h2a4 4 0 004-3" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="note"
          title="Sticky Note (N)"
          aria-label="Sticky note"
        >
          <svg viewBox="0 0 24 24">
            <path d="M5 4h14v10l-5 5H5z" />
            <path d="M19 14h-5v5" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="draw"
          title="Freehand Draw (D)"
          aria-label="Freehand draw"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 20l1-4 11-11 3 3-11 11z" />
            <path d="M14 7l3 3" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="text"
          title="Text Box (T)"
          aria-label="Text box"
        >
          <svg viewBox="0 0 24 24">
            <path d="M5 6h14" />
            <path d="M12 6v13" />
            <path d="M9 19h6" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="signature"
          title="Signature"
          aria-label="Signature"
        >
          <svg viewBox="0 0 24 24">
            <path d="M3 18c4 0 3-9 7-9s2 7 6 7 3-4 5-4" />
            <path d="M3 21h18" />
          </svg>
        </button>
        <button
          class="tool-btn"
          data-tool="eraser"
          title="Eraser (E)"
          aria-label="Eraser"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M8 19l-4-4a2 2 0 010-3l9-9a2 2 0 013 0l4 4a2 2 0 010 3l-9 9z"
            />
            <path d="M9 11l6 6" />
          </svg>
        </button>

        <div class="tb-sep"></div>
        <div id="colorRow"></div>
        <div id="sizeWrap">
          <input
            type="range"
            id="sizeRange"
            min="1"
            max="24"
            value="3"
            aria-label="Ukuran"
          />
        </div>
      </div>

      <div id="pageBadge">– / –</div>
    </div>

    <div id="dropzone">
      <div class="dz-inner">
        <h2>Drop PDF di sini</h2>
        <p>Lepaskan file untuk membuka</p>
      </div>
    </div>

    <div id="modalRoot"></div>
    <div id="toastWrap"></div>
    <button
      id="btnExitPresentation"
      title="Keluar presentasi (Esc)"
      aria-label="Keluar presentasi"
    >
      <svg viewBox="0 0 24 24">
        <path d="M8 3v3a2 2 0 01-2 2H3" />
        <path d="M21 8h-3a2 2 0 01-2-2V3" />
        <path d="M3 16h3a2 2 0 012 2v3" />
        <path d="M16 21v-3a2 2 0 012-2h3" />
      </svg>
    </button>
    <input type="file" id="fileInput" accept="application/pdf" class="hidden" />
    <div id="printContainer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
